<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Liat &amp; Yarin — Save the Date</title>
  <!--
    קבצים הדרושים (אותה תיקיה):
      invitation.jpg  — תמונת ההזמנה
      seal.png        — תמונת חותמת השעווה
      music.mp3       — מוזיקת רקע (אופציונלי)
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Great+Vibes&family=Montserrat:wght@200;300&display=swap" rel="stylesheet">

  <style>

    /* ── Tokens ────────────────────────────── */
    :root {
      --bg:        #ddd4be;   /* linen background          */
      --body:      #f4eadb;   /* envelope front face       */
      --fold-l:    #ecdfc8;   /* left fold triangle        */
      --fold-r:    #f0e4cc;   /* right fold triangle       */
      --fold-b:    #e8d8be;   /* bottom fold triangle      */
      --flap-f:    #ede1cb;   /* flap (front / outside)    */
      --flap-in:   #f9f3eb;   /* flap inside (seen open)   */
      --gold:      #c9a96e;
      --text:      #4a3c2c;
      --soft:      #9a8a78;
    }

    /* ── Reset ─────────────────────────────── */
    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Cormorant Garamond', Georgia, serif;
    }


    /* ═══════════════════════════════════════════
       SCREEN 1  ·  ENVELOPE
       ═══════════════════════════════════════════ */
    #s1 {
      position: fixed; inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(.6rem, 2.2vh, 1.4rem);
      background: radial-gradient(
        ellipse 180% 110% at 50% 38%,
        #ede4d0 0%, #d8cdb0 55%, #c8bc9c 100%
      );
      transition: opacity .75s ease, transform .75s ease;
    }
    #s1.exit {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
      transition: opacity .35s ease, transform .35s ease;
    }


    /* ── Envelope container ─────────────────────
       Landscape 3:2.  Scales by viewport height
       so it always feels proportional.
    ─────────────────────────────────────────── */
    #envelope {
      position: relative;
      width: min(90vw, calc(62vh * 1.5), 860px);
      aspect-ratio: 3 / 2;
      /*
        perspective lives here so the flap can 3-D rotate.
        overflow must stay VISIBLE so the card can rise above.
      */
      perspective: 1600px;
      perspective-origin: 50% -10%;
    }

    /* every child fills the envelope by default */
    #envelope > * {
      position: absolute;
      inset: 0;
    }


    /* ── Layer 0: ground shadow ─────────────── */
    /*
      A soft ambient shadow cast below the entire envelope
      (separate from the box-shadow so it can blur more naturally).
    */
    #env-shadow {
      inset: 8% 4% -6%;
      background: radial-gradient(
        ellipse 80% 40% at 50% 100%,
        rgba(60,40,15,.38) 0%,
        transparent 70%
      );
      filter: blur(12px);
      z-index: 0;
      pointer-events: none;
    }


    /* ── Layer 1: envelope BODY ─────────────── */
    /*
      The flat front face.  Does NOT clip its children
      so the card and fold triangles can overlay it.
    */
    #env-body {
      background: var(--body);
      border-radius: 3px;
      box-shadow:
        /* hairline border */
        inset 0 0 0 .5px rgba(100,70,30,.15),
        /* contact shadow */
        0 1px  3px rgba(50,30,8,.28),
        0 4px 12px rgba(50,30,8,.22),
        0 16px 36px rgba(50,30,8,.18),
        0 36px 60px rgba(50,30,8,.12);
      z-index: 1;
      overflow: hidden;
    }

    /* subtle top-edge highlight (light from above) */
    #env-body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 12%;
      background: linear-gradient(
        to bottom,
        rgba(255,245,220,.16) 0%,
        transparent 100%
      );
      pointer-events: none;
    }

    /* subtle inner vignette (edges slightly darker) */
    #env-body::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(
        ellipse 90% 85% at 50% 55%,
        transparent 55%,
        rgba(80,55,20,.07) 100%
      );
      pointer-events: none;
    }


    /* ── Layers 2a-2c: fold triangles ───────────
       A real envelope has 4 triangular flaps that
       fold to form the body.  These three triangles
       (left / right / bottom) are visible on the
       front face, giving it depth and realism.

       All four fold centres meet at (50%, 50%) —
       the exact geometric centre of the envelope.
    ─────────────────────────────────────────── */

    /* Left fold — comes from the left edge */
    #fold-l {
      clip-path: polygon(0 50%, 0 100%, 50% 50%);
      background: linear-gradient(
        135deg,
        rgba(140,100,50,.09) 0%,
        rgba(140,100,50,.04) 100%
      );
      z-index: 2;
      pointer-events: none;
    }
    /* Left-fold crease line */
    #fold-l::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom right,
        transparent calc(50% - .6px),
        rgba(100,70,25,.18) 50%,
        transparent calc(50% + .6px)
      );
    }

    /* Right fold — mirror of left */
    #fold-r {
      clip-path: polygon(100% 50%, 50% 50%, 100% 100%);
      background: linear-gradient(
        225deg,
        rgba(100,70,25,.05) 0%,
        rgba(100,70,25,.10) 100%
      );
      z-index: 2;
      pointer-events: none;
    }
    #fold-r::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom left,
        transparent calc(50% - .6px),
        rgba(100,70,25,.18) 50%,
        transparent calc(50% + .6px)
      );
    }

    /* Bottom fold — rises from the bottom edge */
    #fold-b {
      clip-path: polygon(0 100%, 50% 50%, 100% 100%);
      background: linear-gradient(
        to bottom,
        rgba(80,55,20,.11) 0%,
        rgba(80,55,20,.05) 100%
      );
      z-index: 2;
      pointer-events: none;
    }
    /* thin crease at the fold-centre point */
    #fold-b::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 1px; height: 50%;
      background: linear-gradient(
        to bottom,
        rgba(100,70,25,.20),
        transparent
      );
    }


    /* ── Layer 3: invitation card ────────────── */
    /*
      Portrait card, centered inside the landscape envelope.
      Hidden initially (opacity:0) — JS reveals it when the
      flap is mid-open.  Then it rises and rotates.
    */
    #env-card {
      inset: 5% 28% 3%;          /* portrait shape, centered */
      border-radius: 2px;
      overflow: hidden;
      z-index: 3;
      opacity: 0;
      transition: opacity .5s ease;
      box-shadow:
        0 2px  6px rgba(50,30,8,.14),
        0 6px 16px rgba(50,30,8,.10);
      will-change: transform, opacity;
    }
    #env-card img {
      width: 100%; height: 100%;
      display: block;
      object-fit: cover;
      pointer-events: none;
    }

    /* rise + rotate to landscape animation */
    #env-card.rise {
      animation: riseAndTurn 1.4s cubic-bezier(.22, 0, .1, 1) forwards;
    }
    @keyframes riseAndTurn {
      0%   { transform: translateY(0)     rotate(0deg)   scale(1);    }
      28%  { transform: translateY(-20%)  rotate(38deg)  scale(1.03); }
      65%  { transform: translateY(-50%)  rotate(90deg)  scale(1.07); }
      84%, 100% { transform: translateY(-54%) rotate(90deg) scale(1.07); }
    }


    /* ── Layer 4: fold-crease line ─────────────
       Sits at 50% — where all folds meet.
       Two-tone for a sharp paper-fold look.
    ─────────────────────────────────────────── */
    #env-crease {
      inset: calc(50% - 1px) 0 auto;
      height: 2px;
      background: linear-gradient(
        180deg,
        rgba(40,25,5,.28) 0%,
        rgba(40,25,5,.28) 50%,
        rgba(255,230,170,.22) 51%,
        transparent 100%
      );
      z-index: 4;
      pointer-events: none;
    }


    /* ── Layer 5: envelope FLAP ─────────────────
       V-shaped (clip-path triangle) that sits on
       top of the fold and rotates open in 3-D.

       Geometry:
         The flap tip meets the fold-centre at
         exactly (50%, 50%) of the envelope —
         same point where all three fold triangles meet.

       clip-path polygon runs in the flap element's
       OWN coordinate space (height = 50%).
    ─────────────────────────────────────────── */
    #env-flap {
      /* fills top half of envelope */
      top: 0; left: 0; right: 0;
      height: 50%;
      inset: auto 0 auto 0;     /* override the inherited inset:0 */
      top: 0;

      /* V-shape: two top corners + tip at bottom-center */
      clip-path: polygon(0 0, 100% 0, 50% 100%);

      background: linear-gradient(
        175deg,
        #f0e6d2 0%,
        #e8dac4 55%,
        #e0d0b8 100%
      );

      border-radius: 3px 3px 0 0;

      /* cast a shadow onto the body below */
      box-shadow:
        0 3px  8px rgba(40,25,5,.22),
        0 1px  2px rgba(40,25,5,.32);

      /* 3-D pivot on the TOP edge */
      transform-origin: 50% 0%;
      transform-style: preserve-3d;
      z-index: 5;

      transition: transform 1.25s cubic-bezier(.38, 0, .1, 1);
    }

    /* Inside face of flap — lighter parchment seen after opening */
    #env-flap::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(
        170deg,
        #faf5ec 0%,
        #f2e8d8 60%,
        #eaddca 100%
      );
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform: rotateY(180deg) translateZ(.5px);
      backface-visibility: visible;
    }

    /* Slight highlight on the flap's top edge */
    #env-flap::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 30%;
      background: linear-gradient(
        to bottom,
        rgba(255,248,230,.18) 0%,
        transparent 100%
      );
      clip-path: polygon(0 0, 100% 0, 50% 330%);
      pointer-events: none;
    }

    /* JS triggers this class → flap swings backward */
    #env-flap.open {
      transform: rotateX(-180deg);
    }


    /* ── Layer 6: wax seal image ────────────────
       Sits right at the fold-crease (50% from top),
       perfectly centered — sealing the V-flap tip
       against the body.
    ─────────────────────────────────────────── */
    #env-seal {
      inset: auto;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      width:  clamp(150px, 31vw, 270px);
      aspect-ratio: 1 / 1;
      height: auto;
      border-radius: 50%;
      overflow: hidden;
      z-index: 6;

      cursor: pointer;
      user-select: none;

      /* raised 3-D shadow */
      filter:
        drop-shadow(0 2px  3px rgba(30,5,5,.60))
        drop-shadow(0 5px 12px rgba(30,5,5,.38))
        drop-shadow(0 10px 22px rgba(30,5,5,.22));

      transition:
        transform .18s cubic-bezier(.4,0,.2,1),
        filter    .18s ease;
      will-change: transform, filter, opacity;
    }

    #env-seal img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    /* hover: lifts slightly */
    #env-seal:hover {
      transform: translate(-50%,-50%) translateY(-3px) scale(1.05);
      filter:
        drop-shadow(0 5px  8px rgba(30,5,5,.65))
        drop-shadow(0 10px 20px rgba(30,5,5,.40))
        drop-shadow(0 18px 32px rgba(30,5,5,.22));
    }

    /* tap: presses into the envelope */
    #env-seal.pressed {
      transform: translate(-50%,-50%) scale(.82) translateY(3px);
      filter:
        drop-shadow(0 1px 2px rgba(30,5,5,.55))
        drop-shadow(0 2px 5px rgba(30,5,5,.28));
      transition:
        transform .13s cubic-bezier(.4,0,.6,1),
        filter    .13s ease;
    }

    /* seal cracks and detaches */
    #env-seal.detach {
      opacity: 0;
      transform: translate(-50%,-50%) scale(.5) rotate(12deg);
      filter: none;
      pointer-events: none;
      transition:
        opacity   .55s ease,
        transform .6s  cubic-bezier(.4,0,.2,1),
        filter    .3s  ease;
    }


    /* ── Tap hint ───────────────────────────── */
    .tap-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .45rem;
    }
    .tap-label {
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1rem, 3.6vw, 1.2rem);
      letter-spacing: .28em;
      color: #3A2F27;
      text-shadow:
        0 1px 8px rgba(255,245,225,.85),
        0 0px 20px rgba(255,240,200,.55);
      animation: pulse 3.5s ease-in-out infinite;
    }
    .tap-rule {
      width: 26px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .tap-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--gold);
      animation: floatDot 2.5s ease-in-out infinite;
    }


    /* ═══════════════════════════════════════════
       SCREEN 2  ·  FULL INVITATION
       ═══════════════════════════════════════════ */
    #s2 {
      position: fixed; inset: 0;
      z-index: 5;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(
        ellipse 180% 110% at 50% 38%,
        #ede4d0 0%, #d8cdb0 55%, #c8bc9c 100%
      );
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    #s2.show { opacity: 1; pointer-events: auto; }

    .s2-inner {
      width: 100%;
      /* constrain by viewport height for desktop proportions */
      max-width: min(92vw, calc(80vh * 5 / 7), 560px);
      padding:
        max(env(safe-area-inset-top,  0px), 2.6rem)
        1.2rem
        max(env(safe-area-inset-bottom, 0px), 2.6rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
    }

    .inv-eyebrow {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-style: normal;
      font-size: clamp(.8rem, 2.4vw, 1rem);
      letter-spacing: .42em;
      text-transform: uppercase;
      color: #3A2F27;
      text-align: center;
      animation: fadeUp .9s ease both;
    }

    .inv-img {
      width: 100%;
      display: block;
      border-radius: 0;
      box-shadow:
        0 3px  6px rgba(60,40,10,.08),
        0 12px 32px rgba(60,40,10,.14),
        0 32px 64px rgba(60,40,10,.09);
      animation: cardReveal 1.1s cubic-bezier(.25, 0, .15, 1) both;
      animation-delay: .2s;
    }

    .inv-note {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-style: normal;
      font-size: clamp(.8rem, 2.4vw, 1rem);
      letter-spacing: .42em;
      text-transform: uppercase;
      color: #3A2F27;
      text-align: center;
      line-height: 1.9;
      animation: fadeUp .9s ease both;
      animation-delay: .45s;
    }


    /* ═══════════════════════════════════════════
       MUSIC BUTTON
       ═══════════════════════════════════════════ */
    #music-btn {
      position: fixed;
      top: max(env(safe-area-inset-top, 0px) + .9rem, 1.1rem);
      right: 1.1rem;
      z-index: 200;
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(201,169,110,.38);
      background: rgba(250,246,240,.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 16px rgba(60,40,10,.10);
      opacity: 0; pointer-events: none;
      transition: opacity .5s ease, border-color .3s ease, transform .25s ease;
    }
    #music-btn.show { opacity: 1; pointer-events: auto; }
    #music-btn:hover { border-color: var(--gold); transform: scale(1.08); }
    #music-btn.on   { border-color: rgba(201,169,110,.65); }
    #music-btn .ico { font-size: 17px; line-height: 1;
                      position: absolute; transition: opacity .25s ease; }
    #music-btn .ico-off   { opacity: 1; }
    #music-btn .ico-on    { opacity: 0; }
    #music-btn.on .ico-off { opacity: 0; }
    #music-btn.on .ico-on  { opacity: 1; }


    /* ═══════════════════════════════════════════
       ANIMATIONS
       ═══════════════════════════════════════════ */
    @keyframes pulse {
      0%,100% { opacity: .36; }
      50%      { opacity: 1;   }
    }
    @keyframes floatDot {
      0%,100% { transform: translateY(0);  opacity: .42; }
      50%     { transform: translateY(6px); opacity: 1;  }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(32px) scale(.964); }
      to   { opacity: 1; transform: translateY(0)     scale(1);   }
    }

  </style>
</head>
<body>


<!-- ═══════════════════════════════════════════════
     SCREEN 1  ·  ENVELOPE
     ═══════════════════════════════════════════════ -->
<div id="s1">

  <div id="envelope" aria-label="Wedding invitation envelope">

    <!-- Ground shadow (separate element for better blur) -->
    <div id="env-shadow" aria-hidden="true"></div>

    <!-- Body — the flat front face -->
    <div id="env-body" aria-hidden="true"></div>

    <!-- Three fold triangles that give the envelope its diamond structure -->
    <div id="fold-l" aria-hidden="true"></div>
    <div id="fold-r" aria-hidden="true"></div>
    <div id="fold-b" aria-hidden="true"></div>

    <!-- Invitation card (hidden, will rise when opened) -->
    <div id="env-card" aria-hidden="true">
      <!-- ★ rename your image to invitation.jpg -->
      <img src="invitation.jpg" alt="Save the Date — Liat &amp; Yarin">
    </div>

    <!-- Crease line at the fold centre -->
    <div id="env-crease" aria-hidden="true"></div>

    <!-- V-shaped flap (rotates open in 3-D) -->
    <div id="env-flap" aria-hidden="true"></div>

    <!-- Wax seal — THE tap/click target -->
    <!-- ★ rename your seal image to seal.png -->
    <div id="env-seal" role="button" tabindex="0"
         aria-label="Tap the seal to open your invitation">
      <img src="seal.png" alt="Wax seal">
    </div>

  </div>

  <!-- Hint below the envelope -->
  <div class="tap-hint" aria-hidden="true">
    <span class="tap-label">Tap the seal to open</span>
    <div class="tap-rule"></div>
    <div class="tap-dot"></div>
  </div>

</div><!-- #s1 -->


<!-- ═══════════════════════════════════════════════
     SCREEN 2  ·  FULL INVITATION
     ═══════════════════════════════════════════════ -->
<div id="s2" aria-hidden="true">
  <div class="s2-inner">

    <p class="inv-eyebrow">You are invited</p>

    <img
      class="inv-img"
      src="invitation.jpg"
      alt="Save the Date — Liat &amp; Yarin · October 15 2026 · Brooklyn, New York"
    >

    <p class="inv-note">We can&rsquo;t wait to<br>celebrate with you.</p>

  </div>
</div><!-- #s2 -->


<!-- ═══════════════════════════════════════════════
     MUSIC TOGGLE
     ═══════════════════════════════════════════════ -->
<button id="music-btn" aria-label="Toggle background music" aria-pressed="false">
  <span class="ico ico-off">🔇</span>
  <span class="ico ico-on">🔊</span>
</button>

<audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>


<script>
  var opened   = false;
  var musicOn  = false;
  var aud      = document.getElementById('bgMusic');
  var musicBtn = document.getElementById('music-btn');
  aud.volume   = 0;

  /* ══════════════════════════════════════════
     Envelope opening sequence
     ══════════════════════════════════════════
     ms  0   — seal pressed  (.pressed)
     ms 170  — seal detaches (.detach)
     ms 420  — flap rotates open
     ms 720  — card fades in from behind flap
     ms 950  — card rises and turns
     ms 2400 — crossfade to invitation screen
     ms 3200 — music button appears
  */
  function openEnvelope() {
    if (opened) return;
    opened = true;

    var seal = document.getElementById('env-seal');
    var flap = document.getElementById('env-flap');
    var card = document.getElementById('env-card');
    var s1   = document.getElementById('s1');
    var s2   = document.getElementById('s2');

    /*
      Timeline (ms from tap):
        0   — seal presses down
        170 — seal detaches
        300 — envelope disappears immediately
        480 — invitation fades in
        1100 — music button appears
    */

    /* ① seal presses in */
    seal.classList.add('pressed');

    /* ② seal cracks and detaches */
    setTimeout(function () {
      seal.classList.remove('pressed');
      seal.classList.add('detach');
    }, 170);

    /* ③ envelope exits immediately — no lingering */
    setTimeout(function () {
      s1.classList.add('exit');
    }, 300);

    /* ④ invitation fades in */
    setTimeout(function () {
      s2.classList.add('show');
      s2.removeAttribute('aria-hidden');
    }, 480);

    /* ⑤ music button */
    setTimeout(function () {
      musicBtn.classList.add('show');
    }, 600);
  }

  function ramp(target, ms, done) {
    clearInterval(ramp._t);
    var from = aud.volume, delta = target - from, n = 60, i = 0;
    ramp._t = setInterval(function () {
      i++;
      aud.volume = Math.min(1, Math.max(0, from + delta * (i / n)));
      if (i >= n) { clearInterval(ramp._t); if (done) done(); }
    }, ms / n);
  }

  function startMusic() {
    if (musicOn) return;
    aud.volume = 0;
    /* .play() MUST be called synchronously inside a user-gesture handler for iOS */
    var p = aud.play();
    if (p !== undefined) {
      p.then(function () {
        musicOn = true;
        musicBtn.classList.add('on');
        musicBtn.setAttribute('aria-pressed', 'true');
        ramp(0.4, 1500);
      }).catch(function () {
        /* blocked — button is visible so user can tap manually */
      });
    }
  }

  /* ── Seal is the ONLY tap target ── */
  var sealEl = document.getElementById('env-seal');

  sealEl.addEventListener('click', function (e) {
    e.stopPropagation();
    startMusic();   /* ← must be before any setTimeout, while still in gesture */
    openEnvelope();
  });

  sealEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      startMusic();
      openEnvelope();
    }
  });

  /* ── Music toggle (mute / unmute) ── */
  musicBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (musicOn) {
      /* mute: fade out and pause */
      ramp(0, 900, function () { aud.pause(); });
      musicOn = false;
      musicBtn.classList.remove('on');
      musicBtn.setAttribute('aria-pressed', 'false');
    } else {
      /* unmute: resume and fade in */
      var p = aud.play();
      if (p !== undefined) {
        p.then(function () {
          musicOn = true;
          musicBtn.classList.add('on');
          musicBtn.setAttribute('aria-pressed', 'true');
          ramp(0.4, 1200);
        }).catch(function () {});
      }
    }
  });
</script>

</body>
</html>
